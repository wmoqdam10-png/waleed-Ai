name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP=$(ls *.zip | head -n 1)
          mkdir -p src
          unzip -q "$ZIP" -d src
          ROOT=$(dirname "$(find src -name settings.gradle.kts | head -n 1)")
          echo "PROJECT_DIR=$ROOT" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare project
        run: |
          cd "$PROJECT_DIR"
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
          keytool -genkeypair -v -keystore debug.keystore -storetype PKCS12 -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          sed -i 's/release(36) { minorApiLevel = 1 }/release(36)/' app/build.gradle.kts
          sed -i 's/^org.gradle.configuration-cache=true/org.gradle.configuration-cache=false/' gradle.properties
          printf '\norg.gradle.jvmargs=-Xmx5g -Dfile.encoding=UTF-8 -Djava.awt.headless=true\n' >> gradle.properties

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          set +e
          gradle assembleDebug --no-daemon --no-configuration-cache 2>&1 | tee build.log
          STATUS=${PIPESTATUS[0]}
          echo "## Build error" >> $GITHUB_STEP_SUMMARY
          grep -A 20 "What went wrong" build.log | sed 's/^/    /' >> $GITHUB_STEP_SUMMARY
          echo "## Last lines" >> $GITHUB_STEP_SUMMARY
          tail -n 40 build.log | sed 's/^/    /' >> $GITHUB_STEP_SUMMARY
          exit $STATUS

      - name: Collect APK
        run: |
          APK=$(find . -path "*outputs/apk/debug/*" -name "*.apk" | head -n 1)
          mkdir -p out
          cp "$APK" out/waleed-ai.apk

      - uses: actions/upload-artifact@v4
        with:
          name: waleed-ai-apk
          path: out/waleed-ai.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "Waleed AI APK"
          files: out/waleed-ai.apk
