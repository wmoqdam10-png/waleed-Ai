name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip AI Studio project
        run: |
          ZIP=$(ls *.zip | head -n 1)
          echo "ZIP file: $ZIP"
          mkdir -p src
          unzip -q "$ZIP" -d src
          ROOT=$(dirname "$(find src \( -name settings.gradle.kts -o -name settings.gradle \) | head -n 1)")
          echo "Project root: $ROOT"
          echo "PROJECT_DIR=$ROOT" >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "build-tools;36.0.0" "platforms;android-36" || true
          sdkmanager "platforms;android-36.1" || true

      - name: Set up Gradle 9.1.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Create .env with the Gemini key
        run: echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > "$PROJECT_DIR/.env"

      - name: Create debug.keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$PROJECT_DIR/debug.keystore" \
            -storetype PKCS12 \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          APK=$(find . -path "*outputs/apk/debug/*" -name "*.apk" | head -n 1)
          echo "Found APK: $APK"
          mkdir -p out
          cp "$APK" out/waleed-ai.apk
          ls -lh out/

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: waleed-ai-apk
          path: out/waleed-ai.apk

      - name: Publish APK as a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Waleed AI APK - Build ${{ github.run_number }}
          files: out/waleed-ai.apk
