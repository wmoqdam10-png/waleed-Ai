name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip AI Studio project
        run: |
          ZIP=$(ls *.zip | head -n 1)
          echo "ZIP file: $ZIP"
          mkdir -p src
          unzip -q "$ZIP" -d src
          ROOT=$(dirname "$(find src \( -name settings.gradle.kts -o -name settings.gradle \) | head -n 1)")
          echo "Project root: $ROOT"
          echo "PROJECT_DIR=$ROOT" >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "build-tools;36.0.0" "platforms;android-36" || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create .env with the Gemini key
        run: echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > "$PROJECT_DIR/.env"

      - name: Create debug.keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$PROJECT_DIR/debug.keystore" \
            -storetype PKCS12 \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Patch project for CI
        run: |
          sed -i 's/release(36) { minorApiLevel = 1 }/release(36)/' "$PROJECT_DIR/app/build.gradle.kts" || true
          sed -i 's/^org.gradle.configuration-cache=true/org.gradle.configuration-cache=false/' "$PROJECT_DIR/gradle.properties" || true
          printf '\norg.gradle.jvmargs=-Xmx5g -Dfile.encoding=UTF-8 -Djava.awt.headless=true\n' >> "$PROJECT_DIR/gradle.properties"
          tail -n 5 "$PROJECT_DIR/gradle.properties"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set +e
          gradle assembleDebug --no-daemon --no-configuration-cache 2>&1 | tee build.log
          STATUS=${PIPESTATUS[0]}
          {
            echo "## Build error"
            echo '```'
            grep -A 25 "What went wrong" build.log | head -n 35
            echo '```'
            echo "## Last 60 lines of the log"
            echo '```'
            tail -n 60 build.log
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
          exit $STATUS

      - name: Collect APK
        run: |
          APK=$(find . -path "*outputs/apk/debug/*" -name "*.apk" | head -n 1)
          echo "Found APK: $APK"
          mkdir -p out
          cp "$APK" out/waleed-ai.apk
          ls -lh out/

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: waleed-ai-apk
          path: out/waleed-ai.apk

      - name: Publish APK as a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Waleed AI APK - Build ${{ github.run_number }}
          files: out/waleed-ai.apk          sed -i 's/release(36) { minorApiLevel = 1 }/release(36)/' "$PROJECT_DIR/app/build.gradle.kts" || true
          sed -i 's/^org.gradle.configuration-cache=true/org.gradle.configuration-cache=false/' "$PROJECT_DIR/gradle.properties" || true

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set +e
          gradle assembleDebug --no-daemon --no-configuration-cache 2>&1 | tee build.log
          STATUS=${PIPESTATUS[0]}
          {
            echo "## Build error"
            echo '```'
            grep -A 25 "What went wrong" build.log | head -n 35
            echo '```'
            echo "## Last 60 lines of the log"
            echo '```'
            tail -n 60 build.log
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
          exit $STATUS

      - name: Collect APK
        run: |
          APK=$(find . -path "*outputs/apk/debug/*" -name "*.apk" | head -n 1)
          echo "Found APK: $APK"
          mkdir -p out
          cp "$APK" out/waleed-ai.apk
          ls -lh out/

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: waleed-ai-apk
          path: out/waleed-ai.apk

      - name: Publish APK as a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Waleed AI APK - Build ${{ github.run_number }}
          files: out/waleed-ai.apk
